[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c4shap"
version = "0.3.0"
description = "Exact Shapley-value explanations for an AlphaZero Connect 4 network"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
az = ["torch", "safetensors", "huggingface_hub"]
dev = ["pytest"]

[project.scripts]
c4shap = "c4shap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
