[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c4shap"
version = "0.2.0"
description = "Explanations for Connect 4 AIs: Shapley values, a perfect solver, and an experimental stone-group explainer"
requires-python = ">=3.10"
dependencies = ["numpy", "shap>=0.45", "matplotlib"]

[project.optional-dependencies]
az = ["torch", "safetensors", "huggingface_hub"]
dev = ["pytest"]

[project.scripts]
c4shap = "c4shap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
